# Licences that may ship in release binaries, in order of preference when a
# crate offers a choice; any other licence fails the release build.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    # colored, via the counting engine's table formatter; the notices link its source.
    "MPL-2.0",
]
# The release targets; crates used only on other platforms do not ship.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Build scripts and test helpers run during compilation but are not part of the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# locmetry itself (publish = false) is covered by LICENSE, not by the notices.
private = { ignore = true }
