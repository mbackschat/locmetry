version = 1

# packages/core-bridge/sdk-core is a Git submodule of the separate repository temporalio/sdk-rust
# (.gitmodules). Its Rust, Go and protobuf code is built into the native bridge but is developed,
# tested and versioned there, so it stays out of this repository's measurement.
[scope]
exclude = ["packages/core-bridge/sdk-core/**"]

[categories]
tooling = "Maintained scripts and configuration for building, generating, linting and publishing"
generated = "Checked-in output of a code generator"
test-support = "Code that exists only to support the test suites"
vendored = "Third-party files copied into the repository"

[[rules]]
id = "generated-payload-visitor"
match = ["packages/proto/src/payload-visitor.generated.ts"]
kind = ["source"]
purpose = "production"
category = "generated"
reason = "Its first line reads 'Code generated by packages/proto/scripts/gen-payload-visitor.ts. DO NOT EDIT.'; the npm layout would count its 5,365 lines as hand-written implementation"

[[rules]]
id = "test-helpers-package"
match = ["packages/test-helpers/src/**"]
kind = ["source"]
purpose = "test"
category = "test-support"
reason = "@temporalio/test-helpers is private and described as 'Internal shared test infrastructure'; packages/test and six contrib packages depend on it, the contrib ones only as devDependencies"

[[rules]]
id = "vendored-gogoproto"
match = ["packages/testing/proto/dependencies/**"]
kind = ["source"]
purpose = "other"
category = "vendored"
reason = "gogo.proto carries the GoGo Authors copyright and redistribution licence header and points at github.com/temporalio/gogo-protobuf"

[[rules]]
id = "package-sources-outside-src"
match = [
  "packages/core-bridge/ts/**",
  "packages/core-bridge/index.js",
  "packages/core-bridge/common.js",
  "packages/core-bridge/common.d.ts",
  "packages/create-project/cli.js",
  "packages/proto/protos/index.js",
  "packages/proto/protos/index.d.ts",
  "packages/proto/protos/root.js",
]
kind = ["source"]
purpose = "production"
category = "implementation"
reason = "Published entry points the npm src/** layout misses: core-bridge/tsconfig.json compiles ts/ to lib/ and its package.json main is index.js, create-project/package.json declares cli.js as main and bin, and proto/package.json main is protos/index.js; the generated protos/json-module.js and root.d.ts are Git-ignored and not matched"

[[rules]]
id = "repository-tooling"
match = [
  "scripts/**",
  "packages/core-bridge/scripts/**",
  "packages/proto/scripts/**",
  "contrib/ai-sdk/scripts/**",
  "packages/docs/**",
  "commitlint.config.js",
  "eslint.config.mjs",
]
kind = ["source"]
purpose = "production"
category = "tooling"
reason = "Scripts that build the native bridge (core-bridge build-rust), generate protobuf code (proto gen), publish the packages to a local Verdaccio registry and run example projects against it (scripts/), and run the ai-sdk tests (contrib/ai-sdk/scripts/run-tests.mjs, a runner), plus lint configuration and the private @temporalio/docs Docusaurus and typedoc site for the API reference"
