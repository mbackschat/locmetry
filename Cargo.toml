[package]
name = "locmetry"
version = "0.5.2"
edition = "2021"
description = "Codebase measurements with explicit scope and purpose classification"
license = "MIT"
repository = "https://github.com/mbackschat/locmetry"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
encoding_rs_io = "0.1"
globset = "0.4"
ignore = "0.4"
rayon = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
terminal_size = "0.4"
tokei = { version = "=15.0.0", default-features = false }
toml = "1"

# No doc-tests exist; skipping rustdoc saves about 3 s per run (measured 2026-10-19).
[lib]
doctest = false

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
