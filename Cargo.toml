[package]
name = "locmetry"
version = "0.1.0"
edition = "2021"
description = "Codebase measurements with explicit scope and purpose classification"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokei = { version = "=15.0.0", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
