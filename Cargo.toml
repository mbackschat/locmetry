[package]
name = "locmetry"
version = "0.11.2"
edition = "2021"
description = "Codebase measurements with explicit scope and purpose classification"
license = "MIT"
repository = "https://github.com/mbackschat/locmetry"
publish = false

[dependencies]
anstyle-query = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.3"
# std::fs::canonicalize returns verbatim \\?\C:\ paths on Windows, which reports
# would show as roots; dunce returns the ordinary form where it is equivalent.
dunce = "1"
encoding_rs_io = "0.1"
globset = "0.4"
ignore = "0.4"
rayon = "1"
same-file = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
terminal_size = "0.4"
tokei = { version = "=15.0.0", default-features = false }
toml = "1"

# No doc-tests exist; skipping rustdoc saves about 3 s per run (measured 2026-10-19).
[lib]
doctest = false

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"

# Linux packages wrap the static musl release binary, so they declare no library
# dependencies; the optional helper only suggests jq, as the Homebrew formula does.
[package.metadata.deb]
maintainer = "Martin Backschat <mbackschat@mail.de>"
section = "devel"
depends = []
suggests = "jq"
license-file = ["LICENSE", "0"]
extended-description = "Locmetry counts code, comments and blank lines, classifies files as production, test or other, and records the rule behind each classification. Reports show results by language and folder and compare saved reports across projects and workspaces."
assets = [
    ["target/release/locmetry", "usr/bin/", "755"],
    ["scripts/compare-locmetry-files.sh", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/locmetry/", "644"],
    ["CHANGELOG.md", "usr/share/doc/locmetry/", "644"],
    ["THIRD-PARTY-NOTICES.md", "usr/share/doc/locmetry/", "644"],
    ["target/generated/locmetry.1", "usr/share/man/man1/", "644"],
    ["target/generated/complete/locmetry.bash", "usr/share/bash-completion/completions/locmetry", "644"],
    ["target/generated/complete/_locmetry", "usr/share/zsh/vendor-completions/", "644"],
    ["target/generated/complete/locmetry.fish", "usr/share/fish/vendor_completions.d/", "644"],
]

# The automatic scan would only find the helper's Bash, declared here instead.
[package.metadata.generate-rpm]
auto-req = "no"
assets = [
    { source = "target/release/locmetry", dest = "/usr/bin/locmetry", mode = "755" },
    { source = "scripts/compare-locmetry-files.sh", dest = "/usr/bin/compare-locmetry-files.sh", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/locmetry/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/locmetry/CHANGELOG.md", mode = "644", doc = true },
    { source = "THIRD-PARTY-NOTICES.md", dest = "/usr/share/doc/locmetry/THIRD-PARTY-NOTICES.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/locmetry/LICENSE", mode = "644", doc = true },
    { source = "target/generated/locmetry.1", dest = "/usr/share/man/man1/locmetry.1", mode = "644", doc = true },
    { source = "target/generated/complete/locmetry.bash", dest = "/usr/share/bash-completion/completions/locmetry", mode = "644" },
    { source = "target/generated/complete/_locmetry", dest = "/usr/share/zsh/site-functions/_locmetry", mode = "644" },
    { source = "target/generated/complete/locmetry.fish", dest = "/usr/share/fish/vendor_completions.d/locmetry.fish", mode = "644" },
]

[package.metadata.generate-rpm.requires]
bash = "*"

[package.metadata.generate-rpm.suggests]
jq = "*"

[profile.release]
strip = true
lto = "thin"
