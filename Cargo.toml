[package]
name = "locmetry"
version = "0.1.2"
edition = "2021"
description = "Codebase measurements with explicit scope and purpose classification"
license = "MIT"
repository = "https://github.com/mbackschat/locmetry"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokei = { version = "=15.0.0", default-features = false }
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
