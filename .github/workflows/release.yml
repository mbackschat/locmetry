name: Release

on:
  push:
    tags: ["v*"]
  # A change to this workflow builds and verifies every archive without
  # publishing, so a new target is exercised before its first release.
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          # musl gives Linux binaries without a glibc version floor; every
          # dependency is pure Rust on the target side, so no C toolchain is needed.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # .cargo/config.toml links the C runtime statically.
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag to match the crate version
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo pkgid | sed 's/.*[#@]//')"
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Generate third-party notices
        run: cargo about generate --locked -c packaging/licenses/about.toml packaging/licenses/notices.hbs -o THIRD-PARTY-NOTICES.md
      # Each job generates them with the binary it packages, which runs
      # natively on every release runner; Cargo.toml's package assets and the
      # archives take them from target/generated.
      - name: Generate the man page and completions
        run: |
          generated=target/generated/complete
          mkdir -p "$generated"
          if [ "$RUNNER_OS" = Windows ]; then
            "target/${{ matrix.target }}/release/locmetry.exe" --generate complete-powershell > "$generated/_locmetry.ps1"
          else
            bin="target/${{ matrix.target }}/release/locmetry"
            "$bin" --generate man > target/generated/locmetry.1
            "$bin" --generate complete-bash > "$generated/locmetry.bash"
            "$bin" --generate complete-zsh > "$generated/_locmetry"
            "$bin" --generate complete-fish > "$generated/locmetry.fish"
          fi
      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          [ "$GITHUB_EVENT_NAME" = push ] || version=dry-run
          name="locmetry-${version}-${{ matrix.target }}"
          executable=locmetry
          [ "$RUNNER_OS" = Windows ] && executable=locmetry.exe
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/$executable" README.md CHANGELOG.md LICENSE THIRD-PARTY-NOTICES.md "$name/"
          install -m 755 scripts/compare-locmetry-files.sh "$name/compare-locmetry-files.sh"
          cp -R target/generated/. "$name/"
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "$name.zip" "$name" > /dev/null; else tar -czf "$name.tar.gz" "$name"; fi
          echo "BINARY=$PWD/$name/$executable" >> "$GITHUB_ENV"
      - name: Measure with an empty environment
        run: env -i "$BINARY" --root src > /dev/null
      - name: Verify the packaged helper
        run: |
          if ! command -v jq >/dev/null; then
            case "$RUNNER_OS" in
              macOS) brew install jq ;;
              Linux) sudo apt-get update && sudo apt-get install --yes jq ;;
              Windows) choco install jq --yes --no-progress ;;
            esac
          fi
          smoke=$(mktemp -d)
          trap 'rm -rf "$smoke"' EXIT
          mkdir "$smoke/project"
          printf 'print(1)\n' > "$smoke/project/main.py"
          "$BINARY" --root "$smoke/project" --no-user-config --files --output "$smoke/before.json"
          printf 'print(2)\n' >> "$smoke/project/main.py"
          "$BINARY" --root "$smoke/project" --no-user-config --files --output "$smoke/after.json"
          helper="$(dirname "$BINARY")/compare-locmetry-files.sh"
          LOCMETRY_BIN="$BINARY" "$helper" "$smoke/before.json" "$smoke/after.json" > "$smoke/changes.json"
          jq -e '.source_identity == "not established by reports" and (.changes | length) == 1 and .changes[0].code_delta == 1' "$smoke/changes.json"
          status=0
          PATH="" /bin/bash "$helper" "$smoke/before.json" "$smoke/after.json" > "$smoke/out" 2> "$smoke/err" || status=$?
          test "$status" = 1
          test ! -s "$smoke/out"
          grep -q 'brew install jq' "$smoke/err"
      - name: Require static linkage
        if: runner.os == 'Linux'
        run: file "$BINARY" | grep -E 'statically linked|static-pie linked'
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.1
      # The packages wrap the binary checked above; Cargo.toml holds their
      # metadata. Each is installed and measured in a clean container.
      - name: Build and install the Linux packages
        if: runner.os == 'Linux'
        run: |
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output ./
          cargo generate-rpm --target ${{ matrix.target }} --output ./
          packaging/linux/verify-packages.sh .
      # A dynamically linked C runtime appears as an imported DLL name.
      - name: Require the static C runtime
        if: runner.os == 'Windows'
        run: |
          ! grep -qiaE 'vcruntime[0-9]*\.dll|msvcp[0-9]*\.dll|api-ms-win-crt-' "$BINARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            locmetry-*.tar.gz
            locmetry-*.zip
            locmetry*.deb
            locmetry*.rpm

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The version's CHANGELOG.md section is the release text.
      - run: python3 scripts/release.py "${GITHUB_REF_NAME#v}" --notes > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - run: sha256sum locmetry-*.tar.gz locmetry-*.zip locmetry*.deb locmetry*.rpm > SHA256SUMS
        working-directory: dist
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" locmetry-*.tar.gz locmetry-*.zip locmetry*.deb locmetry*.rpm SHA256SUMS
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
