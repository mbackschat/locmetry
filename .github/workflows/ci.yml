name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The declared release targets: macOS arm64, Linux x86_64 and aarch64,
        # and Windows x86_64 (docs/proposals/archive/windows-support.md).
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check documentation indexes and maintenance tooling
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 scripts/test_release.py
          python3 scripts/test_doc_indexes.py
          python3 scripts/test_recorded_guides.py
          python3 scripts/test_file_sizes.py
          python3 scripts/test_agent_regression_trend.py
          python3 scripts/doc-indexes.py check
          python3 scripts/agent-regression-trend.py check
      - name: Gate source file sizes with Locmetry's own measurement
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/check-file-sizes.py
      # Warnings and errors fail; mandoc's style notes, such as source lines
      # longer than 80 bytes, are inherent in clap_mangen's output.
      - name: Lint the generated man page
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes mandoc
          target/debug/locmetry --generate man > "$RUNNER_TEMP/locmetry.1"
          mandoc -T lint -W warning "$RUNNER_TEMP/locmetry.1"
      - name: Execute README CI recipes
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq
          bash scripts/check-doc-examples.sh

      - name: Install optional documentation tooling
        if: matrix.os == 'ubuntu-24.04'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.11'
          enable-cache: false
      - name: Replay command guides
        id: showboat
        if: matrix.os == 'ubuntu-24.04'
        run: |
          uv run --no-project --python 3.11 --with showboat==0.6.1 \
            python scripts/check-recorded-guides.py --set reference --artifacts-dir "$RUNNER_TEMP/showboat"
      - name: Upload Showboat failure evidence
        if: failure() && matrix.os == 'ubuntu-24.04' && steps.showboat.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: showboat-failure-evidence
          path: ${{ runner.temp }}/showboat
          if-no-files-found: warn
          retention-days: 7
      # The pins file names tag and commit, so it keys the pinned Immich checkouts.
      - name: Restore Immich showcase checkouts
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/cache@v6
        with:
          path: ~/.cache/locmetry/showcase
          key: immich-showcase-${{ hashFiles('examples/showcase/immich/pins.tsv') }}
      - name: Replay showcase recordings
        id: showcase
        if: matrix.os == 'ubuntu-24.04'
        run: |
          bash scripts/fetch-showcase.sh
          uv run --no-project --python 3.11 --with showboat==0.6.1 \
            python scripts/check-recorded-guides.py --set showcase --artifacts-dir "$RUNNER_TEMP/showcase"
      - name: Upload showcase failure evidence
        if: failure() && matrix.os == 'ubuntu-24.04' && steps.showcase.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: showcase-failure-evidence
          path: ${{ runner.temp }}/showcase
          if-no-files-found: warn
          retention-days: 7

  # Fails when a new dependency brings a licence the release may not ship.
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: cargo about generate --locked -c packaging/licenses/about.toml packaging/licenses/notices.hbs -o THIRD-PARTY-NOTICES.md
