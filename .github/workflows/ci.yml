name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The declared release targets: macOS arm64, Linux x86_64 and aarch64.
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check documentation indexes and maintenance tooling
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 scripts/test_release.py
          python3 scripts/test_doc_indexes.py
          python3 scripts/test_recorded_guides.py
          python3 scripts/doc-indexes.py check
      - name: Execute README CI recipes
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq
          cargo build --locked
          bash scripts/check-doc-examples.sh

      - name: Install optional documentation tooling
        if: matrix.os == 'ubuntu-24.04'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.11'
          enable-cache: false
      - name: Replay command guides and check analytics recipes
        if: matrix.os == 'ubuntu-24.04'
        run: |
          uv run --no-project --python 3.11 \
            --with showboat==0.6.1 --with duckdb==1.5.6 \
            python scripts/check-recorded-guides.py
          uv run --no-project --python 3.11 \
            --with duckdb==1.5.6 --with pandas==3.0.6 --with polars==2.0.0 \
            python scripts/test_analytics_cookbooks.py

  # Fails when a new dependency brings a licence the release may not ship.
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: cargo about generate --locked -c packaging/licenses/about.toml packaging/licenses/notices.hbs -o THIRD-PARTY-NOTICES.md
